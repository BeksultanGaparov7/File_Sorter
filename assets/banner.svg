<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="File Sorter — keeps your Downloads folder from turning into a junk drawer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <g transform="translate(80,88)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="-1">File Sorter</text>
    <text x="2" y="52" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#8b949e">Keeps your ~/Downloads from turning into a junk drawer.</text>
    <text x="2" y="104" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#58a6ff" letter-spacing="3">RUST &#183; LINUX &#183; SYSTEMD &#183; INOTIFY</text>
  </g>

  <g transform="translate(860,96)">
    <rect x="0" y="24" width="132" height="96" rx="12" fill="url(#folder)"/>
    <path d="M0 40 Q0 28 12 28 L48 28 L62 16 L120 16 Q132 16 132 28 L132 40 Z" fill="#388bfd"/>
    <rect x="18" y="58" width="96" height="8" rx="4" fill="#c9d1d9" opacity="0.85"/>
    <rect x="18" y="76" width="72" height="8" rx="4" fill="#c9d1d9" opacity="0.6"/>
    <rect x="18" y="94" width="84" height="8" rx="4" fill="#c9d1d9" opacity="0.4"/>
  </g>

  <g transform="translate(1036,136)" fill="none" stroke="#3fb950" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 8 H44"/>
    <path d="M30 0 L44 8 L30 16"/>
  </g>

  <g transform="translate(1112,96)">
    <rect x="0" y="24" width="132" height="96" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="3"/>
    <path d="M0 40 Q0 28 12 28 L48 28 L62 16 L120 16 Q132 16 132 28 L132 40 Z" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="66" cy="76" r="22" fill="none" stroke="#3fb950" stroke-width="5"/>
    <path d="M56 76 L63 84 L77 68" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
